<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面小助手</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="app">
    <!-- 顶部工具栏 -->
    <div id="toolbar">
      <div class="toolbar-left">
        <div class="config-selector">
          <select id="config-select">
            <option value="">加载中...</option>
          </select>
          <span id="config-info" class="config-badge">加载中...</span>
        </div>
      </div>
      <div class="toolbar-right">
        <button id="quick-new-conversation-btn" class="toolbar-action-btn" type="button" title="开启新对话">
          <span class="toolbar-action-icon">＋</span>
          <span>新对话</span>
        </button>
        <button id="network-chat-toggle-btn" class="toolbar-action-btn hidden" type="button" title="联网聊天">
          <span class="toolbar-action-icon">🌐</span>
          <span>联机</span>
        </button>
        <button id="history-toggle-btn" class="toolbar-icon-btn" title="对话记录">☰</button>
        <button id="settings-btn" class="toolbar-icon-btn" title="设置">⚙️</button>
      </div>
    </div>

    <!-- 对话记录侧栏，默认收起 -->
    <aside id="history-sidebar" class="history-sidebar collapsed" aria-label="对话记录">
      <div class="history-header">
        <h2>对话记录</h2>
        <button id="history-close-btn" class="history-icon-btn" title="收起">‹</button>
      </div>
      <button id="new-conversation-btn" class="new-conversation-btn" type="button">新对话</button>
      <div id="history-list" class="history-list"></div>
      <div id="history-empty" class="history-empty">暂无历史对话</div>
    </aside>

    <!-- 联网聊天侧栏 -->
    <aside id="network-chat-panel" class="network-chat-panel collapsed" aria-label="联网聊天">
      <div class="network-chat-header">
        <h2>联网聊天</h2>
        <button id="network-chat-close-btn" class="history-icon-btn" title="收起">‹</button>
      </div>
      <div id="network-chat-status" class="network-chat-status">未连接</div>
      <select id="network-chat-target" class="network-chat-target">
        <option value="">所有在线用户</option>
      </select>
      <div id="network-chat-users" class="network-chat-users"></div>
      <div id="network-chat-messages" class="network-chat-messages"></div>
      <div class="network-chat-compose">
        <textarea id="network-chat-input" maxlength="1000" placeholder="给其他桌宠发消息"></textarea>
        <button id="network-chat-send-btn" type="button">发送</button>
      </div>
    </aside>

    <!-- 对话历史区域 -->
    <div id="chat-container">
      <div id="messages"></div>
    </div>

    <!-- 输入区域 -->
    <div id="input-container">
      <!-- 快捷模板栏 -->
      <div id="template-bar" class="template-bar">
        <div class="template-quick-buttons" id="quick-templates">
          <!-- 快捷模板按钮将由 JS 动态生成 -->
        </div>
      </div>

      <div id="image-attachment-preview" class="image-attachment-preview hidden">
        <img id="image-attachment-thumbnail" alt="已粘贴的图片">
        <span>已粘贴图片，将随消息发送</span>
        <button id="remove-image-attachment" type="button" title="移除图片">×</button>
      </div>
      
      <div class="input-wrapper">
        <textarea 
          id="user-input" 
          placeholder="输入问题，或粘贴图片... (Enter 发送，Shift+Enter 换行)"
          rows="1"
        ></textarea>
        <div class="input-actions">
          <button id="screenshot-btn" class="input-icon-btn" title="截图分析">📸</button>
        </div>
      </div>
      <div class="send-area">
        <button id="send-btn" class="send-btn">
          <span>发送</span>
          <span class="send-shortcut">Enter</span>
        </button>
        <button id="stop-btn" class="stop-btn hidden">
          <span>⏹️ 停止生成</span>
        </button>
      </div>
    </div>
    
    
  </div>

  <!-- 状态提示 -->
  <div id="status" class="hidden"></div>

  <!-- 编辑消息模态框 -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>✏️ 编辑消息</h3>
        <button class="modal-close" id="edit-modal-close">×</button>
      </div>
      <div class="modal-body">
        <textarea id="edit-input" placeholder="编辑您的消息..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-btn cancel" id="edit-cancel">取消</button>
        <button class="modal-btn primary" id="edit-confirm">重新发送</button>
      </div>
    </div>
  </div>

<!-- 先加载友好消息模块 -->
<script src="friendly-messages.js"></script>
<script src="markdown-renderer.js"></script>
<script src="image-attachment.js"></script>
<script src="image-intent.js"></script>
<script src="reminder-intent.js"></script>
<!-- 再加载主逻辑 -->
<script src="chat.js"></script>
</body>
</html>
