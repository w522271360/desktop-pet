<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面宠物</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pet-size: 92px;
      --pet-ratio: 1.083333;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    #pet-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 6px 8px 8px;
      -webkit-app-region: no-drag;
    }

    #pet-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    #pet-shadow {
      position: absolute;
      bottom: 2px;
      left: calc(8px + (var(--pet-size) * 0.14));
      width: calc(var(--pet-size) * 0.72);
      height: 18px;
      border-radius: 999px;
      background: radial-gradient(ellipse, rgba(80, 52, 25, 0.22), rgba(80, 52, 25, 0));
      animation: shadowPulse 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    #pet-image {
      position: relative;
      z-index: 2;
      width: var(--pet-size);
      height: calc(var(--pet-size) * var(--pet-ratio));
      background: transparent;
      cursor: pointer;
      -webkit-app-region: no-drag;
      filter: drop-shadow(0 16px 18px rgba(74, 47, 22, 0.18));
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    #pet-image:hover {
      filter:
        drop-shadow(0 18px 22px rgba(74, 47, 22, 0.22))
        drop-shadow(0 0 8px rgba(255, 186, 73, 0.18));
    }

    #pet-image:active {
      cursor: grabbing;
    }

    #pet-sprite {
      width: 100%;
      height: 100%;
      background-image: url("../assets/bubu/spritesheet.webp");
      background-repeat: no-repeat;
      background-size: 800% 900%;
      image-rendering: auto;
      pointer-events: none;
    }

    #reminder-bubble {
      display: none;
      position: absolute;
      left: calc(var(--pet-size) + 18px);
      top: 8px;
      z-index: 4;
      width: min(198px, calc(100vw - var(--pet-size) - 32px));
      padding: 12px 13px;
      border: 1px solid rgba(255, 152, 0, 0.22);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 38px rgba(38, 26, 12, 0.2);
      color: #3a2a18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      backdrop-filter: blur(14px);
      -webkit-app-region: no-drag;
      animation: bubbleIn 0.22s ease;
    }

    #reminder-bubble.show {
      display: block;
    }

    #reminder-bubble::after {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 24px;
      width: 15px;
      height: 15px;
      border-left: 1px solid rgba(255, 152, 0, 0.2);
      border-bottom: 1px solid rgba(255, 152, 0, 0.2);
      background: rgba(255, 255, 255, 0.97);
      transform: rotate(45deg);
    }

    #reminder-bubble.attention {
      animation: bubbleNudge 0.34s ease;
    }

    #reminder-bubble.network-bubble {
      width: min(220px, calc(100vw - var(--pet-size) - 30px));
      padding: 13px 14px 12px;
      border-color: rgba(15, 118, 110, 0.2);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.18);
    }

    #reminder-bubble.network-bubble::after {
      border-color: rgba(15, 118, 110, 0.18);
    }

    .reminder-title {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    #reminder-bubble.network-bubble .reminder-title {
      margin-bottom: 9px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 750;
      color: #24302f;
    }

    .reminder-note {
      display: none;
      margin-bottom: 7px;
      font-size: 13px;
      line-height: 1.4;
      color: #6d5637;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reminder-note.show {
      display: block;
    }

    .reminder-time,
    .reminder-queue {
      font-size: 12px;
      line-height: 1.35;
      color: #8a6a3a;
    }

    #reminder-bubble.network-bubble .reminder-time {
      font-size: 12px;
      color: #6b7b78;
    }

    #reminder-bubble.network-bubble .reminder-queue {
      display: none;
    }

    .reminder-queue {
      margin-top: 3px;
    }

    .reminder-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    #reminder-ack {
      position: relative;
      z-index: 2;
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      background: #ff9800;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(255, 152, 0, 0.28);
    }

    #reminder-ack:hover {
      background: #f08c00;
    }

    #context-menu {
      display: none;
      position: fixed;
      min-width: 104px;
      max-width: 116px;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgba(189, 143, 103, 0.26);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 18px 36px rgba(38, 26, 12, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      z-index: 1000;
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-app-region: no-drag;
      transform-origin: 12px 50%;
      animation: contextMenuIn 0.16s ease;
    }

    #context-menu.show {
      display: block;
    }

    #context-menu::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 26px;
      width: 14px;
      height: 14px;
      border-left: 1px solid rgba(189, 143, 103, 0.22);
      border-bottom: 1px solid rgba(189, 143, 103, 0.22);
      background: rgba(255, 255, 255, 0.88);
      transform: rotate(45deg);
      backdrop-filter: blur(18px);
    }

    .menu-item {
      position: relative;
      z-index: 1;
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 9px 8px;
      color: #3b2a1d;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .menu-item:hover {
      background: rgba(255, 152, 0, 0.14);
      color: #d96f00;
      transform: translateY(-1px);
    }

    .menu-item + .menu-item {
      margin-top: 3px;
    }

    @keyframes shadowPulse {
      0%, 100% {
        transform: scaleX(1);
        opacity: 0.72;
      }
      45% {
        transform: scaleX(0.8);
        opacity: 0.46;
      }
    }

    @keyframes nudge {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      42% {
        transform: translateY(-10px) scale(1.06);
      }
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes bubbleNudge {
      0%, 100% {
        transform: translateY(0);
      }
      45% {
        transform: translateY(-5px);
      }
    }

    @keyframes contextMenuIn {
      from {
        opacity: 0;
        transform: translateX(-6px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="pet-container">
    <div id="pet-stage">
      <div id="reminder-bubble" aria-live="assertive">
        <div class="reminder-title" id="reminder-title"></div>
        <div class="reminder-note" id="reminder-note"></div>
        <div class="reminder-time" id="reminder-time"></div>
        <div class="reminder-queue" id="reminder-queue"></div>
        <div class="reminder-actions">
          <button id="reminder-ack" type="button">知道了</button>
        </div>
      </div>
      <div id="pet-shadow"></div>
      <div id="pet-image" title="点击打开对话">
        <div id="pet-sprite" role="img" aria-label="布布"></div>
      </div>
    </div>
  </div>

  <div id="context-menu">
    <button class="menu-item" id="menu-quit" type="button">关闭宠物</button>
    <button class="menu-item" id="menu-restart" type="button">重新打开</button>
  </div>

  <script>
    const petImage = document.getElementById('pet-image');
    const petSprite = document.getElementById('pet-sprite');
    const contextMenu = document.getElementById('context-menu');
    const reminderBubble = document.getElementById('reminder-bubble');
    const reminderTitle = document.getElementById('reminder-title');
    const reminderNote = document.getElementById('reminder-note');
    const reminderTime = document.getElementById('reminder-time');
    const reminderQueue = document.getElementById('reminder-queue');
    const reminderAck = document.getElementById('reminder-ack');
    const fallbackElectronAPI = {
      openChat: () => {},
      pasteToChat: () => {},
      focusPetWindow: () => {},
      openSettings: () => {},
      restartApp: () => {},
      quitApp: () => {},
      dragPetWindow: (position) => {
        window.__petDebug.dragCalls.push(position);
        document.body.dataset.dragCalls = String(window.__petDebug.dragCalls.length);
      },
      logPetInteraction: () => {},
      storeGet: async () => null,
      acknowledgeReminder: async () => ({ success: true }),
      onReminderDue: () => {},
      onReminderCleared: () => {},
      onPetNetworkBubble: () => {},
      closePetNetworkBubble: () => {},
      onPetImageUpdated: () => {},
      onPetCharacterUpdated: () => {},
      onPetSizeUpdated: () => {}
    };
    const petAPI = { ...fallbackElectronAPI, ...(window.electronAPI || {}) };
    const closeContextMenu = () => {
      contextMenu.classList.remove('show');
    };

    window.__petDebug = {
      openChatCalls: 0,
      dragCalls: [],
      states: []
    };
    document.body.dataset.openChatCalls = '0';
    document.body.dataset.dragCalls = '0';

    const spriteColumns = 8;
    const spriteRows = 9;
    const petCharacters = {
      bubu: {
        label: '布布',
        spritesheet: '../assets/bubu/spritesheet.webp'
      },
      yier: {
        label: '一二',
        spritesheet: '../assets/yier/spritesheet.webp'
      }
    };
    const petStates = {
      idle: { row: 0, frames: 6, fps: 5 },
      'running-right': { row: 1, frames: 8, fps: 12 },
      'running-left': { row: 2, frames: 8, fps: 12 },
      waving: { row: 3, frames: 4, fps: 7 },
      jumping: { row: 4, frames: 5, fps: 8 },
      failed: { row: 5, frames: 8, fps: 7 },
      waiting: { row: 6, frames: 6, fps: 5 },
      running: { row: 7, frames: 6, fps: 9 },
      review: { row: 8, frames: 6, fps: 6 }
    };

    let animationTimer = null;
    let currentState = 'idle';
    let currentFrame = 0;
    let mouseStart = null;
    let isMouseDown = false;
    let isDraggingWindow = false;
    let lastDragX = 0;
    let suppressNextClick = false;
    let isPetHovered = false;
    let activeReminder = null;
    let activeNetworkBubble = null;

    function applyPetCharacter(character) {
      const petCharacter = petCharacters[character] || petCharacters.bubu;
      petSprite.style.backgroundImage = `url("${petCharacter.spritesheet}")`;
      petSprite.setAttribute('aria-label', petCharacter.label);
      renderFrame();
    }

    function formatReminderTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('zh-CN', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function focusReminderBubble() {
      if (!activeReminder) return;
      reminderBubble.classList.remove('attention');
      void reminderBubble.offsetWidth;
      reminderBubble.classList.add('attention');
      playMomentaryState('waiting', 700);
      logInteraction('focus-reminder', { reminderId: activeReminder.id });
    }

    function showReminderBubble(payload) {
      const reminder = payload?.reminder;
      if (!reminder) return;
      activeReminder = reminder;
      reminderBubble.classList.remove('network-bubble');
      reminderTitle.textContent = reminder.title;
      reminderNote.textContent = reminder.note || '';
      reminderNote.classList.toggle('show', Boolean(reminder.note));
      reminderTime.textContent = formatReminderTime(reminder.scheduledAt);
      reminderQueue.textContent = payload.queueCount > 0 ? `还有 ${payload.queueCount} 条` : '';
      reminderBubble.classList.add('show');
      playMomentaryState('waiting', 900);
      logInteraction('show-reminder', { reminderId: reminder.id, queueCount: payload.queueCount || 0 });
    }

    function hideReminderBubble() {
      activeReminder = null;
      activeNetworkBubble = null;
      reminderBubble.classList.remove('show', 'attention', 'network-bubble');
      reminderTitle.textContent = '';
      reminderNote.textContent = '';
      reminderNote.classList.remove('show');
      reminderTime.textContent = '';
      reminderQueue.textContent = '';
      setPetState('idle');
    }

    function showNetworkBubble(payload) {
      if (!payload?.text) return;
      activeNetworkBubble = payload;
      activeReminder = null;
      const source = payload.from?.nickname || '服务端';
      reminderBubble.classList.add('network-bubble');
      reminderTitle.textContent = payload.text;
      reminderNote.textContent = '';
      reminderNote.classList.remove('show');
      reminderTime.textContent = `-- 来自 ${source}`;
      reminderQueue.textContent = '';
      reminderBubble.classList.add('show');
      playMomentaryState('waiting', 900);
      logInteraction('show-network-bubble', { source: payload.from?.clientId || 'server' });
    }

    function logInteraction(type, details = {}) {
      petAPI.logPetInteraction({
        type,
        state: currentState,
        ...details
      });
    }

    function renderFrame() {
      const state = petStates[currentState] || petStates.idle;
      const x = currentFrame % spriteColumns;
      const y = state.row % spriteRows;
      const denominatorX = spriteColumns - 1;
      const denominatorY = spriteRows - 1;
      petSprite.style.backgroundPosition = `${(x / denominatorX) * 100}% ${(y / denominatorY) * 100}%`;
    }

    function setPetState(stateName, options = {}) {
      const state = petStates[stateName] ? stateName : 'idle';
      const replay = options.replay || state !== currentState;
      currentState = state;
      petImage.dataset.state = state;
      window.__petDebug.states.push(state);
      document.body.dataset.lastState = state;

      if (replay) {
        currentFrame = 0;
      }

      clearInterval(animationTimer);
      renderFrame();

      const stateConfig = petStates[currentState];
      animationTimer = setInterval(() => {
        currentFrame = (currentFrame + 1) % stateConfig.frames;
        renderFrame();
      }, 1000 / stateConfig.fps);
    }

    function playMomentaryState(stateName, duration = 900) {
      setPetState(stateName, { replay: true });
      clearTimeout(playMomentaryState.timer);
      playMomentaryState.timer = setTimeout(() => {
        setPetState('idle');
      }, duration);
    }

    function openChat() {
      if (activeReminder) {
        focusReminderBubble();
        return;
      }
      playMomentaryState('waving', 900);
      window.__petDebug.openChatCalls += 1;
      document.body.dataset.openChatCalls = String(window.__petDebug.openChatCalls);
      logInteraction('open-chat');
      petAPI.openChat();
    }

    function openSettings() {
      playMomentaryState('review', 1100);
      petAPI.openSettings();
    }

    function activateHoverState() {
      if (!isPetHovered || !document.hasFocus()) {
        isPetHovered = true;
        petAPI.focusPetWindow();
      }

      if (!isMouseDown) {
        setPetState('jumping', { replay: true });
        logInteraction('hover');
      }
    }

    petImage.addEventListener('mouseenter', activateHoverState);
    petImage.addEventListener('mouseover', activateHoverState);
    petImage.addEventListener('mousemove', activateHoverState);

    petImage.addEventListener('mouseleave', () => {
      isPetHovered = false;
      if (!isMouseDown) {
        setPetState('idle');
      }
    });

    petImage.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      mouseStart = {
        clientX: event.clientX,
        clientY: event.clientY,
        screenX: event.screenX,
        screenY: event.screenY,
        offsetX: event.clientX,
        offsetY: event.clientY
      };
      isMouseDown = true;
      isDraggingWindow = false;
      lastDragX = event.screenX;
      setPetState('running');
      logInteraction('mouse-down', { x: event.screenX, y: event.screenY });
    });

    window.addEventListener('mousemove', (event) => {
      if (!isMouseDown || !mouseStart) return;
      const deltaX = event.clientX - mouseStart.clientX;
      const deltaY = event.clientY - mouseStart.clientY;
      const distance = Math.hypot(deltaX, deltaY);

      if (distance > 4) {
        isDraggingWindow = true;
      }

      if (!isDraggingWindow) return;

      const nextState = event.screenX >= lastDragX ? 'running-right' : 'running-left';
      lastDragX = event.screenX;
      setPetState(nextState);
      logInteraction('drag', { x: event.screenX, y: event.screenY, direction: nextState });
      petAPI.dragPetWindow({
        screenX: event.screenX,
        screenY: event.screenY,
        offsetX: mouseStart.offsetX,
        offsetY: mouseStart.offsetY
      });
    });

    window.addEventListener('mouseup', (event) => {
      if (!isMouseDown) return;
      event.preventDefault();
      suppressNextClick = isDraggingWindow;
      isMouseDown = false;
      mouseStart = null;

      if (isDraggingWindow) {
        playMomentaryState('review', 600);
        isDraggingWindow = false;
        logInteraction('drag-end');
      } else {
        logInteraction('click-release');
        if (activeReminder) {
          focusReminderBubble();
        } else {
          openChat();
        }
      }
    });

    petImage.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      suppressNextClick = false;
    });

    window.addEventListener('keydown', (event) => {
      if (!isPetHovered) return;

      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'v') {
        event.preventDefault();
        event.stopPropagation();
        playMomentaryState('waving', 700);
        logInteraction('paste-to-chat');
        petAPI.pasteToChat();
      }
    });

    window.addEventListener('blur', () => {
      isMouseDown = false;
      isDraggingWindow = false;
      mouseStart = null;
      setPetState('idle');
      closeContextMenu();
    });

    petImage.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      event.stopPropagation();

      let menuX = event.clientX + 36;
      let menuY = event.clientY;
      const menuWidth = 116;
      const menuHeight = 84;

      if (menuX + menuWidth > window.innerWidth) {
        menuX = Math.max(5, window.innerWidth - menuWidth - 5);
      }

      if (menuY + menuHeight > window.innerHeight) {
        menuY = Math.max(5, window.innerHeight - menuHeight - 5);
      }

      contextMenu.style.left = `${menuX}px`;
      contextMenu.style.top = `${menuY}px`;
      contextMenu.classList.add('show');
    });

    document.addEventListener('pointerdown', (event) => {
      if (contextMenu.contains(event.target)) return;
      closeContextMenu();
    }, true);

    document.addEventListener('click', (event) => {
      if (contextMenu.contains(event.target)) return;
      closeContextMenu();
    });

    document.getElementById('menu-restart').addEventListener('click', () => {
      petAPI.restartApp();
    });
    document.getElementById('menu-quit').addEventListener('click', () => {
      petAPI.quitApp();
    });

    reminderAck.addEventListener('click', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (!activeReminder) return;

      const reminderId = activeReminder.id;
      reminderAck.disabled = true;
      try {
        await petAPI.acknowledgeReminder(reminderId);
        logInteraction('acknowledge-reminder', { reminderId });
      } finally {
        reminderAck.disabled = false;
      }
    });

    reminderAck.addEventListener('click', (event) => {
      if (!activeNetworkBubble || activeReminder) return;
      event.preventDefault();
      event.stopPropagation();
      hideReminderBubble();
      petAPI.closePetNetworkBubble();
    });

    document.addEventListener('dragstart', (event) => {
      event.preventDefault();
    });

    petImage.addEventListener('dragover', (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (event.dataTransfer.types.includes('Files')) {
        setPetState('waiting');
      }
    });

    petImage.addEventListener('dragleave', (event) => {
      event.preventDefault();
      event.stopPropagation();
      setPetState('idle');
    });

    petImage.addEventListener('drop', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      setPetState('failed');
    });

    petAPI.onPetImageUpdated((imagePath) => {
      playMomentaryState(imagePath ? 'review' : 'waving', 900);
    });

    petAPI.onPetCharacterUpdated((character) => {
      applyPetCharacter(character);
      playMomentaryState('waving', 900);
    });

    petAPI.onPetSizeUpdated((imageSize) => {
      document.documentElement.style.setProperty('--pet-size', `${imageSize}px`);
    });

    petAPI.onReminderDue(showReminderBubble);
    petAPI.onReminderCleared(hideReminderBubble);
    petAPI.onPetNetworkBubble(showNetworkBubble);

    async function loadSavedPetSize() {
      const size = await petAPI.storeGet('petSize') || 'medium';
      const sizes = { small: 72, medium: 92, large: 116 };
      document.documentElement.style.setProperty('--pet-size', `${sizes[size] || sizes.medium}px`);
    }

    async function loadSavedPetCharacter() {
      const character = await petAPI.storeGet('petCharacter') || 'bubu';
      applyPetCharacter(character);
    }

    loadSavedPetCharacter();
    loadSavedPetSize();
    setPetState('idle');
  </script>
</body>
</html>
