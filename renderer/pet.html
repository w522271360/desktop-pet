<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面宠物</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pet-size: 92px;
      --pet-ratio: 1.083333;
      --pet-pad: 12px;
      --primary: #FF9800;
      --primary-dark: #F57C00;
      --text-main: #4A3728;
      --bubble-bg: rgba(255, 255, 255, 0.98);
      --shadow: 0 12px 32px rgba(139, 94, 60, 0.18);
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    #pet-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: var(--pet-pad);
      -webkit-app-region: no-drag;
    }

    #pet-stage {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      width: 100%;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    #pet-shadow {
      position: absolute;
      right: calc(var(--pet-pad) + (var(--pet-size) * 0.14));
      bottom: 4px;
      width: calc(var(--pet-size) * 0.72);
      height: 14px;
      border-radius: 999px;
      background: radial-gradient(ellipse, rgba(139, 94, 60, 0.25), rgba(139, 94, 60, 0));
      animation: shadowPulse 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    #pet-image {
      position: relative;
      z-index: 2;
      width: var(--pet-size);
      height: calc(var(--pet-size) * var(--pet-ratio));
      background: transparent;
      cursor: pointer;
      -webkit-app-region: no-drag;
      filter: drop-shadow(0 12px 14px rgba(74, 47, 22, 0.15));
      transition: transform 0.25s var(--bounce), filter 0.25s ease;
    }

    #pet-image:hover {
      transform: scale(1.05) translateY(-4px);
      filter:
        drop-shadow(0 16px 20px rgba(74, 47, 22, 0.2))
        drop-shadow(0 0 12px rgba(255, 186, 73, 0.25));
    }

    #pet-image:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    #pet-sprite {
      width: 100%;
      height: 100%;
      background-image: url("../assets/bubu/spritesheet.webp");
      background-repeat: no-repeat;
      background-size: 800% 900%;
      image-rendering: auto;
      pointer-events: none;
    }

    #reminder-bubble {
      display: none;
      position: absolute;
      right: calc(var(--pet-size) + var(--pet-pad) + 18px);
      top: 16px;
      z-index: 4;
      width: min(220px, calc(100vw - var(--pet-size) - 40px));
      padding: 16px;
      border: 2px solid #FFEBD6;
      border-radius: 24px;
      background: var(--bubble-bg);
      box-shadow: var(--shadow);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(12px);
      -webkit-app-region: no-drag;
      animation: bubbleIn 0.4s var(--bounce);
    }

    #reminder-bubble.show {
      display: block;
    }

    #reminder-bubble::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 46px;
      width: 16px;
      height: 16px;
      border-right: 2px solid #FFEBD6;
      border-top: 2px solid #FFEBD6;
      background: var(--bubble-bg);
      transform: rotate(45deg);
      border-radius: 2px;
    }

    #reminder-bubble.network-bubble {
      top: auto;
      right: calc(var(--pet-size) + 8px);
      bottom: calc(var(--pet-pad) + (var(--pet-size) * 0.58));
      width: auto;
      min-width: 86px;
      max-width: min(168px, calc(100vw - var(--pet-size) - 44px));
      padding: 9px 12px 8px;
      border: 1px solid rgba(140, 82, 35, 0.12);
      border-radius: 20px 20px 8px 20px;
      background: linear-gradient(180deg, rgba(255, 254, 251, 0.98), rgba(255, 247, 235, 0.96));
      box-shadow: 0 10px 22px rgba(74, 47, 22, 0.12);
      cursor: pointer;
      animation: networkBubbleIn 0.28s var(--bounce);
    }

    #reminder-bubble.network-bubble::after {
      right: -6px;
      top: auto;
      bottom: 14px;
      width: 11px;
      height: 11px;
      border-right: 1px solid rgba(140, 82, 35, 0.12);
      border-top: 1px solid rgba(140, 82, 35, 0.12);
      background: rgba(255, 247, 235, 0.96);
    }

    #reminder-bubble.network-bubble .reminder-title {
      margin-bottom: 4px;
      font-size: 16px;
      line-height: 1.25;
      color: #5C3B23;
      word-break: break-word;
    }

    #reminder-bubble.network-bubble .reminder-time {
      font-size: 10px;
      line-height: 1.2;
      color: rgba(141, 105, 68, 0.72);
    }

    #reminder-bubble.network-bubble .reminder-actions {
      display: none;
    }

    .reminder-title {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
      color: var(--primary-dark);
    }

    .reminder-note {
      display: none;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.5;
      color: #8D7665;
      white-space: pre-wrap;
    }

    .reminder-note.show {
      display: block;
    }

    .reminder-time {
      font-size: 12px;
      font-weight: 700;
      color: #B49A7A;
    }

    .reminder-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    #reminder-ack {
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.25);
      transition: all 0.2s var(--bounce);
    }

    #reminder-ack:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(255, 152, 0, 0.35);
    }

    #context-menu {
      display: none;
      position: absolute;
      right: calc(var(--pet-size) + var(--pet-pad) + 14px);
      bottom: calc(var(--pet-pad) + 8px);
      width: 132px;
      padding: 5px;
      border: 1px solid rgba(140, 82, 35, 0.12);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 254, 251, 0.98), rgba(255, 247, 235, 0.96));
      box-shadow: 0 12px 26px rgba(74, 47, 22, 0.14);
      z-index: 1000;
      backdrop-filter: blur(18px);
      animation: contextMenuIn 0.3s var(--bounce);
      -webkit-app-region: no-drag;
    }

    #context-menu::after {
      content: "";
      position: absolute;
      right: -6px;
      bottom: 28px;
      width: 11px;
      height: 11px;
      border-right: 1px solid rgba(140, 82, 35, 0.12);
      border-top: 1px solid rgba(140, 82, 35, 0.12);
      border-radius: 2px;
      background: rgba(255, 247, 235, 0.96);
      transform: rotate(45deg);
    }

    #context-menu.show {
      display: block;
    }

    .menu-item {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 9px 10px;
      color: var(--text-main);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
      transform: translateX(4px);
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(12px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes networkBubbleIn {
      from { opacity: 0; transform: translate(8px, 6px) scale(0.92); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    @keyframes contextMenuIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.25; }
      50% { transform: scaleX(0.8); opacity: 0.15; }
    }
  </style>
</head>
<body>
  <div id="pet-container">
    <div id="pet-stage">
      <div id="reminder-bubble" aria-live="assertive">
        <div class="reminder-title" id="reminder-title"></div>
        <div class="reminder-note" id="reminder-note"></div>
        <div class="reminder-time" id="reminder-time"></div>
        <div class="reminder-queue" id="reminder-queue"></div>
        <div class="reminder-actions">
          <button id="reminder-ack" type="button">知道了</button>
        </div>
      </div>
      <div id="pet-shadow"></div>
      <div id="pet-image" title="点击打开对话">
        <div id="pet-sprite" role="img" aria-label="布布"></div>
      </div>
    </div>
  </div>

  <div id="context-menu">
    <button class="menu-item" id="menu-quit" type="button">关闭宠物</button>
    <button class="menu-item" id="menu-restart" type="button">重新打开</button>
  </div>

  <script>
    const petImage = document.getElementById('pet-image');
    const petSprite = document.getElementById('pet-sprite');
    const contextMenu = document.getElementById('context-menu');
    const reminderBubble = document.getElementById('reminder-bubble');
    const reminderTitle = document.getElementById('reminder-title');
    const reminderNote = document.getElementById('reminder-note');
    const reminderTime = document.getElementById('reminder-time');
    const reminderQueue = document.getElementById('reminder-queue');
    const reminderAck = document.getElementById('reminder-ack');
    const fallbackElectronAPI = {
      openChat: () => {},
      pasteToChat: () => {},
      focusPetWindow: () => {},
      openSettings: () => {},
      openPetNetworkDetail: () => {},
      restartApp: () => {},
      quitApp: () => {},
      dragPetWindow: (position) => {},
      logPetInteraction: () => {},
      storeGet: async () => null,
      acknowledgeReminder: async () => ({ success: true }),
      onReminderDue: () => {},
      onReminderCleared: () => {},
      onPetNetworkBubble: () => {},
      onPetChatBubble: () => {},
      clearPetChatBubble: () => {},
      closePetNetworkBubble: () => {},
      onPetImageUpdated: () => {},
      onPetCharacterUpdated: () => {},
      onPetSizeUpdated: () => {},
      controlPetWindow: () => {}
    };
    const petAPI = { ...fallbackElectronAPI, ...(window.electronAPI || {}) };
    
    let currentState = 'idle';
    let currentFrame = 0;
    let animationTimer = null;
    let currentPetSize = { width: 262, height: 132 }; // 默认 medium
    let currentPetImageSize = 92;
    let mouseStart = null;
    let isMouseDown = false;
    let isDraggingWindow = false;
    let lastDragX = 0;
    let suppressNextClick = false;
    let isPetHovered = false;
    let activeReminder = null;
    let activeNetworkBubble = null;
    let activeChatBubble = null;
    let chatBubbleTimer = null;

    const closeContextMenu = () => {
      if (contextMenu.classList.contains('show')) {
        contextMenu.classList.remove('show');
        // 恢复窗口大小
        petAPI.controlPetWindow('resize', {
          width: currentPetSize.width,
          height: currentPetSize.height,
          anchor: 'bottom-right'
        });
      }
    };

    window.__petDebug = {
      openChatCalls: 0,
      dragCalls: [],
      states: []
    };

    const spriteColumns = 8;
    const spriteRows = 9;
    const petCharacters = {
      bubu: {
        label: '布布',
        spritesheet: '../assets/bubu/spritesheet.webp'
      },
      yier: {
        label: '一二',
        spritesheet: '../assets/yier/spritesheet.webp'
      }
    };
    const petStates = {
      idle: { row: 0, frames: 6, fps: 5 },
      'running-right': { row: 1, frames: 8, fps: 12 },
      'running-left': { row: 2, frames: 8, fps: 12 },
      waving: { row: 3, frames: 4, fps: 7 },
      jumping: { row: 4, frames: 5, fps: 8 },
      failed: { row: 5, frames: 8, fps: 7 },
      waiting: { row: 6, frames: 6, fps: 5 },
      running: { row: 7, frames: 6, fps: 9 },
      review: { row: 8, frames: 6, fps: 6 }
    };

    function applyPetCharacter(character) {
      const petCharacter = petCharacters[character] || petCharacters.bubu;
      petSprite.style.backgroundImage = `url("${petCharacter.spritesheet}")`;
      petSprite.setAttribute('aria-label', petCharacter.label);
      renderFrame();
    }

    function formatReminderTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('zh-CN', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function truncateNetworkBubbleText(text, limit = 20) {
      const characters = Array.from(String(text || '').trim().replace(/\s+/g, ' '));
      if (characters.length <= limit) return characters.join('');
      return `${characters.slice(0, limit).join('')}...`;
    }

    function focusReminderBubble() {
      if (!activeReminder) return;
      reminderBubble.classList.remove('attention');
      void reminderBubble.offsetWidth;
      reminderBubble.classList.add('attention');
      playMomentaryState('waiting', 700);
      logInteraction('focus-reminder', { reminderId: activeReminder.id });
    }

    function showReminderBubble(payload) {
      const reminder = payload?.reminder;
      if (!reminder) return;
      activeReminder = reminder;
      reminderBubble.removeAttribute('title');
      reminderBubble.classList.remove('network-bubble');
      reminderTitle.textContent = reminder.title;
      reminderNote.textContent = reminder.note || '';
      reminderNote.classList.toggle('show', Boolean(reminder.note));
      reminderTime.textContent = formatReminderTime(reminder.scheduledAt);
      reminderQueue.textContent = payload.queueCount > 0 ? `还有 ${payload.queueCount} 条` : '';
      reminderBubble.classList.add('show');
      playMomentaryState('waiting', 900);
      logInteraction('show-reminder', { reminderId: reminder.id, queueCount: payload.queueCount || 0 });
    }

    function hideReminderBubble() {
      activeReminder = null;
      activeNetworkBubble = null;
      activeChatBubble = null;
      clearTimeout(chatBubbleTimer);
      reminderBubble.removeAttribute('title');
      reminderBubble.classList.remove('show', 'attention', 'network-bubble');
      reminderTitle.textContent = '';
      reminderNote.textContent = '';
      reminderNote.classList.remove('show');
      reminderTime.textContent = '';
      reminderQueue.textContent = '';
      setPetState('idle');
    }

    function showNetworkBubble(payload) {
      if (!payload?.text) return;
      activeNetworkBubble = payload;
      activeReminder = null;
      const source = payload.from?.nickname || '服务端';
      reminderBubble.setAttribute('title', payload.text);
      reminderBubble.classList.add('network-bubble');
      reminderTitle.textContent = truncateNetworkBubbleText(payload.text, 20);
      reminderNote.textContent = '';
      reminderNote.classList.remove('show');
      reminderTime.textContent = `来自 ${source}`;
      reminderQueue.textContent = '';
      reminderBubble.classList.add('show');
      playMomentaryState('waiting', 900);
      logInteraction('show-network-bubble', { source: payload.from?.clientId || 'server' });
    }

    function hideChatBubble() {
      if (!activeChatBubble) return;
      activeChatBubble = null;
      clearTimeout(chatBubbleTimer);
      reminderBubble.classList.remove('show', 'attention', 'network-bubble');
      reminderTitle.textContent = '';
      reminderNote.textContent = '';
      reminderNote.classList.remove('show');
      reminderTime.textContent = '';
      reminderQueue.textContent = '';
      setPetState('idle');
    }

    function showChatBubble(payload) {
      if (!payload?.text || activeReminder) return;
      activeChatBubble = payload;
      activeNetworkBubble = null;
      clearTimeout(chatBubbleTimer);
      reminderBubble.removeAttribute('title');
      reminderBubble.classList.remove('network-bubble');
      reminderTitle.textContent = payload.title || '小秘书';
      reminderNote.textContent = payload.text;
      reminderNote.classList.add('show');
      reminderTime.textContent = payload.meta || '';
      reminderQueue.textContent = '';
      reminderBubble.classList.add('show');
      playMomentaryState(payload.variant === 'final' ? 'waving' : 'review', 900);
      logInteraction('show-chat-bubble', { variant: payload.variant || 'chat' });
      chatBubbleTimer = setTimeout(() => {
        if (activeReminder) return;
        hideChatBubble();
      }, payload.variant === 'final' ? 6500 : 2600);
    }

    function logInteraction(type, details = {}) {
      petAPI.logPetInteraction({
        type,
        state: currentState,
        ...details
      });
    }

    function renderFrame() {
      const state = petStates[currentState] || petStates.idle;
      const x = currentFrame % spriteColumns;
      const y = state.row % spriteRows;
      const denominatorX = spriteColumns - 1;
      const denominatorY = spriteRows - 1;
      petSprite.style.backgroundPosition = `${(x / denominatorX) * 100}% ${(y / denominatorY) * 100}%`;
    }

    function setPetState(stateName, options = {}) {
      const state = petStates[stateName] ? stateName : 'idle';
      const replay = options.replay || state !== currentState;
      currentState = state;
      petImage.dataset.state = state;
      window.__petDebug.states.push(state);
      document.body.dataset.lastState = state;

      if (replay) {
        currentFrame = 0;
      }

      clearInterval(animationTimer);
      renderFrame();

      const stateConfig = petStates[currentState];
      animationTimer = setInterval(() => {
        currentFrame = (currentFrame + 1) % stateConfig.frames;
        renderFrame();
      }, 1000 / stateConfig.fps);
    }

    function playMomentaryState(stateName, duration = 900) {
      setPetState(stateName, { replay: true });
      clearTimeout(playMomentaryState.timer);
      playMomentaryState.timer = setTimeout(() => {
        setPetState('idle');
      }, duration);
    }

    function openChat() {
      // 即使有提醒也允许打开对话框
      if (activeReminder) {
        focusReminderBubble();
      }
      playMomentaryState('waving', 900);
      window.__petDebug.openChatCalls += 1;
      document.body.dataset.openChatCalls = String(window.__petDebug.openChatCalls);
      logInteraction('open-chat');
      petAPI.openChat();
    }

    function openSettings() {
      playMomentaryState('review', 1100);
      petAPI.openSettings();
    }

    function activateHoverState() {
      if (!isPetHovered || !document.hasFocus()) {
        isPetHovered = true;
        petAPI.focusPetWindow();
      }

      if (!isMouseDown) {
        setPetState('jumping', { replay: true });
        logInteraction('hover');
      }
    }

    petImage.addEventListener('mouseenter', activateHoverState);
    petImage.addEventListener('mouseover', activateHoverState);
    petImage.addEventListener('mousemove', activateHoverState);

    petImage.addEventListener('mouseleave', () => {
      isPetHovered = false;
      if (!isMouseDown) {
        setPetState('idle');
      }
    });

    petImage.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      mouseStart = {
        clientX: event.clientX,
        clientY: event.clientY,
        screenX: event.screenX,
        screenY: event.screenY,
        offsetX: event.offsetX,
        offsetY: event.offsetY
      };
      isMouseDown = true;
      isDraggingWindow = false;
      lastDragX = event.screenX;
      setPetState('running');
      logInteraction('mouse-down', { x: event.screenX, y: event.screenY });
    });

    window.addEventListener('mousemove', (event) => {
      if (!isMouseDown || !mouseStart) return;
      const deltaX = event.clientX - mouseStart.clientX;
      const deltaY = event.clientY - mouseStart.clientY;
      const distance = Math.hypot(deltaX, deltaY);

      if (distance > 4) {
        isDraggingWindow = true;
      }

      if (!isDraggingWindow) return;

      const nextState = event.screenX >= lastDragX ? 'running-right' : 'running-left';
      lastDragX = event.screenX;
      setPetState(nextState);
      logInteraction('drag', { x: event.screenX, y: event.screenY, direction: nextState });
      petAPI.dragPetWindow({
        deltaX: event.screenX - mouseStart.screenX,
        deltaY: event.screenY - mouseStart.screenY
      });
      mouseStart.screenX = event.screenX;
      mouseStart.screenY = event.screenY;
    });

    window.addEventListener('mouseup', (event) => {
      if (!isMouseDown) return;
      event.preventDefault();
      suppressNextClick = isDraggingWindow;
      isMouseDown = false;
      mouseStart = null;

      if (isDraggingWindow) {
        playMomentaryState('review', 600);
        isDraggingWindow = false;
        logInteraction('drag-end');
      } else {
        logInteraction('click-release');
        openChat();
      }
    });

    petImage.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      suppressNextClick = false;
    });

    window.addEventListener('keydown', (event) => {
      if (!isPetHovered) return;

      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'v') {
        event.preventDefault();
        event.stopPropagation();
        playMomentaryState('waving', 700);
        logInteraction('paste-to-chat');
        petAPI.pasteToChat();
      }
    });

    window.addEventListener('blur', () => {
      isMouseDown = false;
      isDraggingWindow = false;
      mouseStart = null;
      setPetState('idle');
      closeContextMenu();
    });

    petImage.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      event.stopPropagation();

      // 按右下角扩宽，宠物保持原位，菜单作为独立浮层贴在宠物左侧。
      petAPI.controlPetWindow('resize', {
        width: Math.max(currentPetSize.width, 300),
        height: currentPetSize.height,
        anchor: 'bottom-right'
      });

      contextMenu.classList.add('show');
    });

    // 捕获全局点击，确保在透明区域点击也能关闭菜单
    window.addEventListener('mousedown', (event) => {
      if (contextMenu.classList.contains('show')) {
        if (!contextMenu.contains(event.target) && !petImage.contains(event.target)) {
          closeContextMenu();
        }
      }
    });

    document.addEventListener('click', (event) => {
      if (contextMenu.classList.contains('show') && !contextMenu.contains(event.target)) {
        closeContextMenu();
      }
    });

    document.getElementById('menu-restart').addEventListener('click', () => {
      petAPI.restartApp();
    });
    document.getElementById('menu-quit').addEventListener('click', () => {
      petAPI.quitApp();
    });

    reminderAck.addEventListener('click', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (!activeReminder) return;

      const reminderId = activeReminder.id;
      reminderAck.disabled = true;
      try {
        await petAPI.acknowledgeReminder(reminderId);
        logInteraction('acknowledge-reminder', { reminderId });
      } finally {
        reminderAck.disabled = false;
      }
    });

    reminderAck.addEventListener('click', (event) => {
      if (!activeNetworkBubble || activeReminder) return;
      event.preventDefault();
      event.stopPropagation();
      petAPI.openPetNetworkDetail(activeNetworkBubble);
      hideReminderBubble();
      petAPI.closePetNetworkBubble();
    });

    reminderBubble.addEventListener('click', (event) => {
      if (!activeNetworkBubble || activeReminder) return;
      event.preventDefault();
      event.stopPropagation();
      petAPI.openPetNetworkDetail(activeNetworkBubble);
      hideReminderBubble();
      petAPI.closePetNetworkBubble();
    });

    document.addEventListener('dragstart', (event) => {
      event.preventDefault();
    });

    petImage.addEventListener('dragover', (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (event.dataTransfer.types.includes('Files')) {
        setPetState('waiting');
      }
    });

    petImage.addEventListener('dragleave', (event) => {
      event.preventDefault();
      event.stopPropagation();
      setPetState('idle');
    });

    petImage.addEventListener('drop', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      setPetState('failed');
    });

    petAPI.onPetImageUpdated((imagePath) => {
      playMomentaryState(imagePath ? 'review' : 'waving', 900);
    });

    petAPI.onPetCharacterUpdated((character) => {
      applyPetCharacter(character);
      playMomentaryState('waving', 900);
    });

    petAPI.onPetSizeUpdated((imageSize) => {
      document.documentElement.style.setProperty('--pet-size', `${imageSize}px`);
      // 同步更新窗口大小记录
      const windowSizes = { 72: { w: 238, h: 105 }, 92: { w: 262, h: 132 }, 116: { w: 288, h: 163 } };
      const wSize = windowSizes[imageSize] || windowSizes[92];
      currentPetSize = { width: wSize.w, height: wSize.h };
    });

    petAPI.onReminderDue(showReminderBubble);
    petAPI.onReminderCleared(hideReminderBubble);
    petAPI.onPetNetworkBubble(showNetworkBubble);
    petAPI.onPetChatBubble(showChatBubble);

    async function loadSavedPetSize() {
      const size = await petAPI.storeGet('petSize') || 'medium';
      const sizes = { small: 72, medium: 92, large: 116 };
      const windowSizes = { small: { w: 238, h: 105 }, medium: { w: 262, h: 132 }, large: { w: 288, h: 163 } };
      
      const imageSize = sizes[size] || sizes.medium;
      const wSize = windowSizes[size] || windowSizes.medium;
      
      document.documentElement.style.setProperty('--pet-size', `${imageSize}px`);
      currentPetSize = { width: wSize.w, height: wSize.h };
    }

    async function loadSavedPetCharacter() {
      const character = await petAPI.storeGet('petCharacter') || 'bubu';
      applyPetCharacter(character);
    }

    loadSavedPetCharacter();
    loadSavedPetSize();
    setPetState('idle');
  </script>
</body>
</html>
