<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex 操控</title>
  <link rel="stylesheet" href="codex-control.css">
</head>
<body>
  <main class="shell">
    <aside class="threads-pane">
      <section id="connection-card" class="connection-card compact">
        <div class="status-line">
          <span id="status-dot" class="status-dot"></span>
          <strong id="status-title">未连接</strong>
        </div>
        <div class="connection-row">
          <p id="status-detail">正在读取插件配置...</p>
          <button id="connect-btn" class="primary-btn" type="button">重连</button>
        </div>
      </section>

      <div class="list-tools">
        <input id="thread-search" type="search" placeholder="搜索项目或会话">
        <button id="new-thread-btn" class="secondary-btn" type="button">新会话</button>
      </div>

      <div id="thread-list" class="thread-list" aria-live="polite"></div>
      <div id="thread-menu" class="thread-menu hidden" role="menu" aria-hidden="true">
        <button type="button" data-thread-action="rename" role="menuitem">重命名</button>
        <button type="button" data-thread-action="archive" role="menuitem">归档</button>
      </div>
    </aside>

    <section class="chat-pane">
      <header class="chat-header">
        <div class="thread-info">
          <span id="thread-title" class="thread-title">请选择会话</span>
          <span id="thread-meta" class="thread-meta"></span>
        </div>
        <button id="stop-btn" class="secondary-btn hidden" type="button">停止</button>
      </header>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <div class="input-container-inner">
          <textarea id="prompt-input" rows="1" placeholder="有什么我可以帮忙的？" disabled></textarea>

          <div class="composer-actions">
            <div class="project-path-tag" id="cwd-display" title="项目路径">
              <input id="cwd-input" list="cwd-options" placeholder="项目路径..." disabled>
              <datalist id="cwd-options"></datalist>
            </div>

            <div class="action-right">
              <select id="model-select" class="model-select-compact" disabled title="选择模型">
                <option value="">加载中...</option>
              </select>
              <select id="speed-select" class="model-select-compact speed-select-compact" disabled title="选择推理速度">
                <option value="minimal">minimal</option>
                <option value="low">low</option>
                <option value="medium" selected>medium</option>
                <option value="high">high</option>
              </select>
              <button id="send-btn" class="send-btn-pill" type="submit" disabled title="发送 (Enter)" aria-label="发送">
                <span class="send-icon">↑</span>
              </button>
            </div>
          </div>
        </div>
      </form>
    </section>
  </main>

  <div id="rename-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 class="modal-title">重命名会话</h3>
      <div class="modal-input">
        <input id="rename-input" type="text" placeholder="输入新名称...">
      </div>
      <div class="modal-actions">
        <button id="rename-cancel" class="secondary-btn" type="button">取消</button>
        <button id="rename-confirm" class="primary-btn" type="button">确定</button>
      </div>
    </div>
  </div>

  <script src="markdown-renderer.js"></script>
  <script src="codex-control.js"></script>
</body>
</html>
